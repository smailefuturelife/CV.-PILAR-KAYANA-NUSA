<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tambah Promo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .card-custom {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .header-gradient {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      padding: 30px;
      color: white;
    }

    .badge-promo {
      background: #ede9fe;
      color: #7c3aed;
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: bold;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      padding: 12px;
    }

    .btn-save {
      background: #7c3aed;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: bold;
    }

    .btn-save:hover {
      background: #6d28d9;
    }

    .preview-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 16px;
      margin-top: 10px;
      display: none;
      border: 3px solid #e2e8f0;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <div class="card card-custom">

    <div class="header-gradient">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <span class="badge-promo">PROMO PRODUK</span>

          <h3 class="mt-3 fw-bold">
            Tambah Promo Baru
          </h3>

          <p class="mb-0">
            Tambahkan diskon produk dengan syarat minimal pembelian
          </p>
        </div>

        <i class="bi bi-megaphone-fill fs-1"></i>
      </div>
    </div>

    <div class="card-body p-4">

      <form id="promoForm">

        <div class="mb-3">
          <label class="form-label fw-bold">Pilih Produk</label>

          <select id="product" class="form-select" required>
            <option value="">-- Pilih Produk --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Diskon (%)</label>

          <input
            type="number"
            id="discount"
            class="form-control"
            placeholder="Contoh: 20"
            min="1"
            max="100"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Minimal Pembelian</label>

          <input
            type="number"
            id="min_purchase"
            class="form-control"
            placeholder="Contoh: 50000"
            min="0"
            value="0"
            required
          >
        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Tanggal Mulai</label>

            <input
              type="date"
              id="start_date"
              class="form-control"
              required
            >
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Tanggal Selesai</label>

            <input
              type="date"
              id="end_date"
              class="form-control"
              required
            >
          </div>

        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Preview Produk</label>

          <img id="preview" class="preview-image">
        </div>

        <button type="submit" class="btn btn-save text-white w-100">
          <i class="bi bi-check-circle"></i>
          Simpan Promo
        </button>

      </form>

    </div>

  </div>

</div>

<script src="../js/supabase.js"></script>
<script src="../js/tambahpromo.js"></script>

</body>
</html>
