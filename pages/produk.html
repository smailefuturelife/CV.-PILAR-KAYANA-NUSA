<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelola Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body style="background:#f8fafc;">

<div class="container-fluid p-4">

  <h4 class="mb-4">📦 Kelola Produk</h4>

  <div class="row" id="list"></div>

</div>


<!-- MODAL EDIT PRODUK -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Ubah Produk</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit_id">

        <div class="mb-3">
          <label class="form-label">Nama Produk</label>
          <input id="edit_nama" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kode Barang</label>
          <input id="edit_kode" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Harga</label>
          <input id="edit_harga" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kategori</label>
          <input id="edit_kategori" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stok</label>
          <input id="edit_stok" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Deskripsi Produk</label>
          <textarea id="edit_deskripsi" rows="4" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Ganti Gambar JPG</label>
          <input id="edit_gambar" type="file" accept="image/jpeg" class="form-control">
          <small class="text-muted">Kosongkan jika tidak ingin mengganti gambar.</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Preview Gambar Lama</label>
          <br>
          <img id="edit_preview" src="" width="160" style="border-radius:12px; object-fit:cover;">
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Batal
        </button>

        <button type="button" onclick="simpanEditProduk()" class="btn btn-primary">
          Simpan Perubahan
        </button>
      </div>

    </div>
  </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase Config -->
<script src="../js/supabase.js"></script>

<!-- Produk JS -->
<script src="../js/produk.js"></script>

</body>
</html>
