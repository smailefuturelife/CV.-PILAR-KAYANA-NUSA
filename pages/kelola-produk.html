<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelola Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body style="background:#f8fafc;">

<div class="container-fluid p-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">📦 Kelola Produk</h4>

    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tambahModal">
      + Tambah Produk
    </button>
  </div>

  <div class="row" id="list"></div>

</div>


<!-- MODAL TAMBAH PRODUK -->
<div class="modal fade" id="tambahModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Tambah Produk</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Nama Produk</label>
          <input id="nama" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kode Barang</label>
          <input id="kode" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Harga</label>
          <input id="harga" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kategori</label>
          <input id="kategori" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stok</label>
          <input id="stok" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Deskripsi Produk</label>
          <textarea id="deskripsi" rows="5" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload Gambar (JPG)</label>
          <input id="gambar" type="file" accept="image/jpeg" class="form-control">
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Batal
        </button>

        <button type="button" onclick="tambahProduk()" class="btn btn-primary">
          Simpan Produk
        </button>
      </div>

    </div>
  </div>
</div>


<!-- MODAL EDIT PRODUK -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Ubah Produk</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit_id">

        <div class="mb-3">
          <label class="form-label">Nama Produk</label>
          <input id="edit_nama" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kode Barang</label>
          <input id="edit_kode" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Harga</label>
          <input id="edit_harga" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kategori</label>
          <input id="edit_kategori" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stok</label>
          <input id="edit_stok" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Deskripsi Produk</label>
          <textarea id="edit_deskripsi" rows="4" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Ganti Gambar JPG</label>
          <input id="edit_gambar" type="file" accept="image/jpeg" class="form-control">
          <small class="text-muted">Kosongkan jika tidak ingin mengganti gambar.</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Preview Gambar Lama</label>
          <br>
          <img id="edit_preview" src="" width="160" style="border-radius:12px; object-fit:cover;">
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Batal
        </button>

        <button type="button" onclick="simpanEditProduk()" class="btn btn-primary">
          Simpan Perubahan
        </button>
      </div>

    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/kelola-produk.js"></script>

</body>
</html>
