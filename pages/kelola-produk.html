<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelola Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body style="background:#f8fafc;">

<div class="container-fluid p-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">📦 Kelola Produk</h4>

    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tambahModal">
      + Tambah Produk
    </button>
  </div>

  <div class="row" id="list"></div>

</div>


<!-- MODAL TAMBAH PRODUK -->
<div class="modal fade" id="tambahModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Tambah Produk</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Nama Produk</label>
          <input id="nama" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kode Barang</label>
          <input id="kode" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Harga</label>
          <input id="harga" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kategori</label>
          <input id="kategori" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stok</label>
          <input id="stok" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Deskripsi Produk</label>
          <textarea id="deskripsi" rows="5" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload Banyak Gambar</label>
<input id="gambar" type="file" accept="image/*" multiple class="form-control">
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Batal
        </button>

        <button type="button" onclick="tambahProduk()" class="btn btn-primary">
          Simpan Produk
        </button>
      </div>

    </div>
  </div>
</div>


<!-- MODAL EDIT PRODUK -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Ubah Produk</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit_id">

        <div class="mb-3">
          <label class="form-label">Nama Produk</label>
          <input id="edit_nama" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kode Barang</label>
          <input id="edit_kode" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Harga</label>
          <input id="edit_harga" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Kategori</label>
          <input id="edit_kategori" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stok</label>
          <input id="edit_stok" type="number" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Deskripsi Produk</label>
          <textarea id="edit_deskripsi" rows="4" class="form-control"></textarea>
        </div>

<div class="mb-3">
  <label class="form-label">Ganti Banyak Gambar</label>
  <input id="edit_gambar" type="file" accept="image/*" multiple class="form-control">
  <small class="text-muted">Kosongkan jika tidak ingin mengganti gambar.</small>
</div>

        <div class="mb-3">
          <label class="form-label">Preview Gambar Lama</label>
          <br>
          <img id="edit_preview" src="" width="160" style="border-radius:12px; object-fit:cover;">
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Batal
        </button>

        <button type="button" onclick="simpanEditProduk()" class="btn btn-primary">
          Simpan Perubahan
        </button>
      </div>

    </div>
  </div>
</div>

<!-- MODAL PREVIEW GAMBAR PRODUK -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark">

      <div class="modal-header border-0">
        <h5 class="modal-title text-white">Preview Gambar Produk</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center position-relative">

        <button type="button" onclick="geserPreview(-1)" class="btn btn-light"
          style="position:absolute; left:20px; top:45%; z-index:10; border-radius:50%; width:45px; height:45px; font-size:22px;">
          ‹
        </button>

        <img id="previewBesar" src=""
          style="max-width:100%; max-height:65vh; object-fit:contain; border-radius:12px;">

        <button type="button" onclick="geserPreview(1)" class="btn btn-light"
          style="position:absolute; right:20px; top:45%; z-index:10; border-radius:50%; width:45px; height:45px; font-size:22px;">
          ›
        </button>

        <div id="previewCounter" class="text-white mt-3 fw-bold">1 / 1</div>

        <div class="mt-3 d-flex justify-content-center gap-2">
          <button onclick="jadikanFotoUtama()" class="btn btn-warning">
            Jadikan Utama
          </button>

          <button onclick="geserUrutanFoto(-1)" class="btn btn-info">
            Geser Kiri
          </button>

          <button onclick="geserUrutanFoto(1)" class="btn btn-info">
            Geser Kanan
          </button>

          <button onclick="simpanUrutanFoto()" class="btn btn-success">
            Simpan Urutan
          </button>
        </div>

        <div id="previewThumbs"
          class="d-flex gap-2 mt-3 overflow-auto justify-content-center pb-2">
        </div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/kelola-produk.js"></script>

</body>
</html>
