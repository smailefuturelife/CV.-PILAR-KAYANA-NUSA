<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body style="background:#f8fafc;">

<div class="container-fluid p-4">

  <h4 class="mb-4">➕ Tambah Produk</h4>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <!-- NAMA -->
      <div class="mb-3">
        <label class="form-label">Nama Produk</label>
        <input id="nama" class="form-control">
      </div>

      <!-- KODE -->
      <div class="mb-3">
        <label class="form-label">Kode Barang</label>
        <input id="kode" class="form-control">
      </div>

      <!-- HARGA -->
      <div class="mb-3">
        <label class="form-label">Harga</label>
        <input id="harga" type="number" class="form-control">
      </div>

      <!-- KATEGORI -->
      <div class="mb-3">
        <label class="form-label">Kategori</label>
        <input id="kategori" class="form-control">
      </div>

      <!-- STOK -->
      <div class="mb-3">
        <label class="form-label">Stok</label>
        <input id="stok" type="number" class="form-control">
      </div>

      <!-- DESKRIPSI -->
      <div class="mb-3">
        <label class="form-label">Deskripsi Produk</label>

        <textarea
          id="deskripsi"
          rows="5"
          class="form-control"
          placeholder="Masukkan deskripsi produk..."
        ></textarea>
      </div>

      <!-- GAMBAR -->
      <div class="mb-3">
        <label class="form-label">Upload Gambar (JPG)</label>

        <input
          id="gambar"
          type="file"
          accept="image/jpeg"
          class="form-control"
        >
      </div>

      <!-- BUTTON -->
      <button onclick="tambahProduk()" class="btn btn-primary w-100">
        Simpan Produk
      </button>

    </div>
  </div>

</div>

<script src="../js/supabase.js"></script>

<script>
async function tambahProduk() {

  const supabase = window.supabaseClient;

  // ambil value
  const nama = document.getElementById("nama").value.trim();
  const kode = document.getElementById("kode").value.trim();
  const harga = document.getElementById("harga").value;
  const kategori = document.getElementById("kategori").value.trim();
  const stok = document.getElementById("stok").value;
  const deskripsi = document.getElementById("deskripsi").value.trim();

  const file =
    document.getElementById("gambar").files[0];

  // validasi
  if (
    !nama ||
    !kode ||
    !harga ||
    !kategori ||
    !stok ||
    !deskripsi ||
    !file
  ) {
    alert("Isi semua data!");
    return;
  }

  // validasi jpg
  if (file.type !== "image/jpeg") {
    alert("Hanya file JPG!");
    return;
  }

  // nama file unik
  const fileName =
    Date.now() + "-" + file.name;

  // upload gambar
  const { error: uploadError } =
    await supabase
      .storage
      .from("produk-images")
      .upload(fileName, file);

  if (uploadError) {
    alert(uploadError.message);
    return;
  }

  // ambil public url
  const { data: publicData } =
    supabase
      .storage
      .from("produk-images")
      .getPublicUrl(fileName);

  const imageUrl =
    publicData.publicUrl;

  // insert database
  const { error } =
    await supabase
      .from("products")
      .insert([
        {
          nama_produk: nama,
          kode_barang: kode,
          harga: Number(harga),
          kategori: kategori,
          stok: Number(stok),
          deskripsi: deskripsi,
          gambar: imageUrl
        }
      ]);

  // cek error
  if (error) {

    alert(error.message);

  } else {

    alert("Produk berhasil ditambahkan");

    // reset form
    document.getElementById("nama").value = "";
    document.getElementById("kode").value = "";
    document.getElementById("harga").value = "";
    document.getElementById("kategori").value = "";
    document.getElementById("stok").value = "";
    document.getElementById("deskripsi").value = "";
    document.getElementById("gambar").value = "";

    // reload halaman produk
    parent.loadPage("produk.html");
  }
}
</script>

</body>
</html>
